<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{% block title %}PyTodo Pro{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="topnav">
        <a class="brand" href="{{ url_for('index') if session.get('user_id') else url_for('login_page') }}">PyTodo Pro</a>
        {% if session.get('user_id') %}
        <div class="nav-links">
            <a href="{{ url_for('index') }}">Tasks</a>
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <span class="nav-user">{{ session.get('username') }}</span>
            <a href="{{ url_for('logout') }}">Log out</a>
        </div>
        {% endif %}
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
