{% extends "base.html" %}
{% block title %}Log in — PyTodo Pro{% endblock %}
{% block content %}
<div class="auth-card">
    <h1>Log in</h1>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post">
        <label>Username</label>
        <input type="text" name="username" required>
        <label>Password</label>
        <input type="password" name="password" required>
        <button type="submit">Log in</button>
    </form>
    <p class="muted">No account? <a href="{{ url_for('register_page') }}">Register</a></p>
</div>
{% endblock %}
