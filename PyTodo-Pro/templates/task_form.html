{% extends "base.html" %}
{% block title %}{{ 'Edit Task' if task else 'New Task' }} — PyTodo Pro{% endblock %}
{% block content %}
<h1>{{ 'Edit Task' if task else 'New Task' }}</h1>
<form method="post" class="task-form">
    <label>Title</label>
    <input type="text" name="title" value="{{ task['title'] if task else '' }}" required>

    <label>Description</label>
    <textarea name="description" rows="3">{{ task['description'] if task else '' }}</textarea>

    <label>Category</label>
    <select name="category_id">
        <option value="">None</option>
        {% for c in categories %}
        <option value="{{ c['id'] }}" {% if task and task['category_id'] == c['id'] %}selected{% endif %}>{{ c['name'] }}</option>
        {% endfor %}
    </select>

    <label>Due Date</label>
    <input type="date" name="due_date" value="{{ task['due_date'] if task and task['due_date'] else '' }}">

    <button type="submit">{{ 'Save Changes' if task else 'Create Task' }}</button>
    <a class="btn-secondary" href="{{ url_for('index') }}">Cancel</a>
</form>
{% endblock %}
